name: Compilar APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar web y sincronizar con Android
        # Defina la variable de repositorio API_BASE_URL (Settings > Secrets and variables > Actions > Variables).
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run android:sync -w app

      - name: Compilar APK debug
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: f-saras-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
